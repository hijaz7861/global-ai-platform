services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in your environment or .env file}
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - platform_internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Global AI Platform
      APP_VERSION: 0.2.0
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      DATABASE_URL: postgresql+psycopg://platform:${POSTGRES_PASSWORD}@db:5432/platform
      REQUIRE_EMAIL_VERIFICATION: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      AI_LIVE_CALLS_ENABLED: "false"
      AI_DAILY_REQUEST_LIMIT: "0"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - platform_internal

volumes:
  platform_postgres_data:

networks:
  platform_internal:
