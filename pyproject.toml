[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-ai-platform"
version = "0.2.0"
description = "Secure, modular foundation for a global AI-powered business ecosystem"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "python-dotenv>=1.0,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT>=2.9,<3.0",
  "email-validator>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "cryptography>=50.0.0,<51.0.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10.0.0", "httpx>=0.27,<1.0", "httpx2>=2.0,<3.0"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
